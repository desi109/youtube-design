plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
}
group = 'com.desi'
version = '1.0.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.7')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform { excludeTags 'ffmpeg' } }
tasks.register('ffmpegTest', Test) {
    description = 'Run real FFmpeg integration tests (media tools required)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'ffmpeg' }
    shouldRunAfter test
}
tasks.register('frontendInstall', Exec) { workingDir '../frontend'; commandLine 'npm', 'ci' }
tasks.register('frontendBuild', Exec) { dependsOn 'frontendInstall'; workingDir '../frontend'; commandLine 'npm', 'run', 'build' }
tasks.named('bootJar') { dependsOn 'frontendBuild'; from('../frontend/dist') { into 'BOOT-INF/classes/static' } }
