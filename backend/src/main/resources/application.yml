server:
  address: 127.0.0.1
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:h2:file:${youtube.data-dir:./data}/database/youtube;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=256,expireAfterWrite=60s
  mvc:
    problemdetails:
      enabled: false
youtube:
  data-dir: ${DATA_DIR:./data}
  worker-enabled: true
  ffmpeg: ${FFMPEG_PATH:}
  ffprobe: ${FFPROBE_PATH:}
  encode-timeout-seconds: 3600
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    org.hibernate.orm.jdbc.warn: ERROR
